# Pre-commit fail-fast gate (#1984). Dev-only: installed by `bun install`'s
# `prepare` script into every contributor's local .git/hooks/, never shipped
# in dist/<harness>/ (this repository's own git hooks are not part of the
# distributable framework).
#
# Typecheck and lint already run whole-repo (both comfortably inside the
# budget below); the unit tier is scoped to only the tests that `covers:`
# a staged file (scripts/precommit-related-unit-tests.ts) so the hook stays
# fast regardless of repo size. Heavier integration/e2e tests stay CI's job.
#
# Skip: `git commit --no-verify` (native git flag, always available). CI
# (`bun run check` + the full test suite) is the enforcement backstop for
# any commit made with the hook skipped or not installed.
pre-commit:
  parallel: false
  commands:
    # lefthook orders commands alphanumerically by name unless `priority` is
    # set (https://lefthook.dev/configuration/parallel/) — "lint" < "related-
    # unit-tests" < "typecheck" would otherwise run lint before typecheck.
    # Pin the intended fail-fast order (typecheck, then lint, then the
    # diff-scoped unit tests) explicitly.
    typecheck:
      priority: 1
      run: bun run typecheck
    lint:
      priority: 2
      run: bun run lint
    related-unit-tests:
      priority: 3
      run: bun scripts/precommit-related-unit-tests.ts
