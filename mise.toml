# Repository-pinned toolchain.
#
# formal-model-check verifies the JDK by exact patch version (the planner
# accepts only `openjdk version "26.0.1…"`), because the model-check receipt is
# a reproducibility contract: a different JDK is a different toolchain identity.
#
# Without this file the JDK comes from whatever the machine's global mise
# activates, and `bun` resolved through a mise shim re-applies that global
# JAVA_HOME — so even `JAVA_HOME=… bun …` is overwritten on the way in. The
# result is `ENVIRONMENT_UNAVAILABLE`, which cost four intents the same
# rediscovery (#2410).
#
# Run `mise trust` once in this repository to activate it.
[tools]
java = "temurin-26.0.1+8"
"npm:@openai/codex" = "0.146.0"
"npm:takt" = "0.58.0"
