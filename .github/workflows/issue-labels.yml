name: Issue label sync

permissions: {}

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-label-sync-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Issue Form classification labels
    # Paren width and heading level are rendering details, not classification
    # signals: the Issue Form emits a full-width （）, H3 (`### `) heading,
    # while bodies built by hand or by `gh issue create --body-file`
    # routinely use half-width () and any heading level (H1-H3 observed).
    # Gating on the full literal `### 優先度` skipped this job — and with it
    # the whole fail-closed classification check — for every CLI-filed Issue
    # whose heading wasn't exactly H3. `contains()` is plain substring
    # matching (no regex), so drop the leading hashes from the literal: for
    # any heading level N (1-6), `#{N} 優先度` ends in the substring
    # `# 優先度` (the last hash, the space, then the stem) so a single
    # literal covers every level. Gate on the heading stem alone and let the
    # script below decide, so an unrecognizable body fails loudly instead of
    # never being looked at. Trade-off: this also fires on non-heading
    # occurrences of the same five characters (e.g. inside a quoted code
    # block or prose) — accepted because over-firing degrades to the script's
    # existing loud "分類を取得できませんでした" failure, never to silence.
    if: contains(github.event.issue.body, '# 優先度')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write # Issue Form の分類ラベルを追加・削除するために必要
    steps:
      - name: Apply labels selected in the Issue Form
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body ?? "";

            // Match a heading regardless of paren width. Only the PATTERN is
            // widened — the body and the captured value stay untouched, so a
            // dropdown value that happens to contain parens is unaffected.
            function headingPattern(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              return escaped.replace(/\\\(|（/g, "[(（]").replace(/\\\)|）/g, "[)）]");
            }

            // The Issue Form renders headings as H3, but bodies built by hand
            // or by `gh issue create --body-file` are not bound to that
            // level (#2916). Match any heading level 1-6 so the job gate
            // (widened the same way, see the `if:` comment above) and this
            // script agree on what counts as the field.
            const HEADING_PREFIX = "^#{1,6}[ \\t]+";

            function field(label) {
              const match = body.match(
                new RegExp(`${HEADING_PREFIX}${headingPattern(label)}\\s*\\n+([^\\n]+)`, "m"),
              );
              return match?.[1]?.trim() ?? "";
            }

            function hasField(label) {
              return new RegExp(`${HEADING_PREFIX}${headingPattern(label)}\\s*$`, "m").test(body);
            }

            const typeSignals = [
              ["bug", "重大度（どれだけ深刻か）"],
              ["enhancement", "エレベーターピッチ"],
              ["documentation", "対象読者・ドキュメント面"],
              ["question", "回答してほしい問い・選択肢"],
            ];
            const issueTypes = typeSignals.filter(([, label]) => hasField(label)).map(([type]) => type);
            const priority = (field("優先度（いつ対応するか）") || field("優先度（いつ直すか）"))
              .match(/^P[0-3]\b/)?.[0];
            if (issueTypes.length !== 1 || !priority) {
              core.setFailed("Issue Form から種別/P分類を取得できませんでした");
              return;
            }
            const issueType = issueTypes[0];

            const desired = new Set([issueType, priority]);
            if (issueType === "bug") {
              const severity = field("重大度（どれだけ深刻か）").match(/^S[1-4]-(?:FATAL|CRITICAL|MAJOR|MINOR)\b/)?.[0];
              const cause = field("原因の所在");
              const causes = new Set([
                "要件での見落とし",
                "設計判断の誤り",
                "設計は正しいが実装が逸脱",
                "origin:bootstrap",
                "外部要因",
                "未特定",
              ]);
              if (!severity || !causes.has(cause)) {
                core.setFailed("バグ Issue Form から S分類/原因の所在を取得できませんでした");
                return;
              }
              desired.add(severity);
              if (cause === "origin:bootstrap") desired.add("origin:bootstrap");
            }

            const managed = new Set([
              "bug", "enhancement", "documentation", "question",
              "P0", "P1", "P2", "P3",
              "S1-FATAL", "S2-CRITICAL", "S3-MAJOR", "S4-MINOR",
              "origin:bootstrap",
            ]);
            const existing = new Set(issue.labels.map((label) => typeof label === "string" ? label : label.name));
            const add = [...desired].filter((label) => !existing.has(label));
            if (add.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: add,
              });
            }

            for (const label of [...existing].filter((name) => managed.has(name) && !desired.has(name))) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label,
                });
              } catch (error) {
                // The webhook payload's label snapshot can go stale against
                // GitHub's live state within the time this job takes to run
                // (observed ~10s TOCTOU window, #2561). A DELETE 404 means the
                // label is already gone — the intended end state — so this is
                // idempotent, symmetric with addLabels. Any other status
                // (403/429/5xx/...) stays fail-closed and aborts the run.
                if (error?.status !== 404) throw error;
                core.info(`removeLabel(${label}) 404: already absent, treating as success`);
              }
            }
