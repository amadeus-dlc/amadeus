name: Property-based testing

# Daily, non-blocking deep property-based verification, split out of the
# blocking CI tier in the same way as the performance workflow.
#
# The ordinary CI suite still runs every *.pbt.test.ts file with fast-check's
# default deterministic budget. This workflow raises the selected expensive
# properties to AMADEUS_PBT_DEEP=1 without extending pull-request latency.
#
# Non-blocking loud-fail contract: this workflow is deliberately independent
# from ci.yml and branch protection. A red run never blocks a pull request, but
# remains visible in the Actions tab and in the failing run's step summary.
#
# Schedule suspension: GitHub disables `schedule` triggers after roughly 60 days
# without repository activity. If daily runs stop appearing, re-enable the
# schedule from the Actions tab.

on:
  schedule:
    # 18:17 UTC = 03:17 JST, deliberately off the :00/:30 congestion peaks and
    # after the 02:47 JST performance workflow.
    - cron: "17 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: pbt-deep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pbt-deep:
    name: PBT deep run
    runs-on: ubuntu-latest
    # 2x the expected wall clock: the deep set's local run is 9.5s (max real of
    # 3 runs), x3 for the shared x86 runner is ~28s, plus checkout/bun install
    # setup (~120s) is about 2.5 min; 2 x 2.5 = 4.9, rounded up to 5.
    timeout-minutes: 5
    env:
      TEST_TIME_FACTOR: "2"
      PBT_DEEP_PATHS: |
        tests/integration/t417-election-store-failclosed.pbt.test.ts
        tests/unit/t418-state-receipts-codec.pbt.test.ts
        tests/unit/t419-state-field-codec.pbt.test.ts
        tests/unit/t274-amadeus-mirror-state-codec.test.ts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the deep target set exists
        id: pbt_deep_paths
        # bun test drops a non-existent path silently and still exits 0, so an
        # unverified path list can report a deep run that never happened.
        run: |
          set -o pipefail
          missing=0
          count=0
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            count=$((count + 1))
            if [ ! -f "${path}" ]; then
              echo "missing deep target: ${path}"
              missing=$((missing + 1))
            fi
          done <<< "${PBT_DEEP_PATHS}"
          if [ "${count}" -eq 0 ]; then
            echo "the deep target list is empty; refusing to report an empty deep run"
            exit 1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "${missing} deep target(s) missing; refusing to report a partial deep run"
            exit 1
          fi
          echo "expected-files=${count}" >> "${GITHUB_OUTPUT}"
          echo "verified ${count} deep target(s)"

      - name: Run the deep PBT tier
        id: pbt_deep_run
        env:
          AMADEUS_PBT_DEEP: "1"
        run: |
          set -o pipefail
          # Match the repository runner's 30-second baseline and apply the CI
          # factor. The deep integration property exceeds Bun's 5-second default.
          paths=()
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            paths+=("${path}")
          done <<< "${PBT_DEEP_PATHS}"
          bun test --timeout="$(bun tests/test-timeout-ms.ts 30000)" "${paths[@]}" 2>&1 | tee pbt-deep-run.log

      - name: Verify every target file actually ran
        env:
          EXPECTED_FILES: ${{ steps.pbt_deep_paths.outputs.expected-files }}
        run: |
          set -o pipefail
          actual=$(grep -oE 'Ran [0-9]+ tests across [0-9]+ files?\.' pbt-deep-run.log \
            | tail -n 1 | grep -oE 'across [0-9]+' | grep -oE '[0-9]+')
          if [ -z "${actual}" ]; then
            echo "could not read the file count out of pbt-deep-run.log"
            exit 1
          fi
          if [ "${actual}" != "${EXPECTED_FILES}" ]; then
            echo "deep run covered ${actual} file(s); expected ${EXPECTED_FILES}"
            exit 1
          fi
          echo "deep run covered all ${actual} target file(s)"

      - name: Summarise failure
        if: ${{ failure() && steps.pbt_deep_run.conclusion == 'failure' }}
        run: |
          {
            echo "### PBT deep run failed"
            echo
            echo 'Last 50 lines of the deep run (fast-check prints the seed, replay path, and shrunk counterexample):'
            echo
            echo '```'
            tail -n 50 pbt-deep-run.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
