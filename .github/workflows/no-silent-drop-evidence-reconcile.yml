name: No Silent Drop Evidence Reconcile

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: no-silent-drop-evidence-reconcile-main
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile no-silent-drop evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.METRICS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.METRICS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Checkout event revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Bun
        id: setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub App identity
        id: configure
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Reconcile evidence revision
        id: reconcile
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          result=$(bun scripts/no-silent-drop-evidence.ts reconcile \
            --event-revision "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY")
          status=$?
          set -e
          printf '%s\n' "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report preflight failure
        if: ${{ failure() && steps.reconcile.outcome != 'failure' }}
        env:
          EVENT_REVISION: ${{ github.sha }}
          CREDENTIAL_OUTCOME: ${{ steps.app-token.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        shell: bash
        run: |
          code=REBIND_PREFLIGHT_FAILED
          if [ "$CREDENTIAL_OUTCOME" = failure ]; then
            code=REBIND_CREDENTIAL_FAILED
          elif [ "$CHECKOUT_OUTCOME" = failure ]; then
            code=REBIND_CHECKOUT_FAILED
          fi
          printf '{"code":"%s","targetRevision":"%s"}\n' "$code" "$EVENT_REVISION" >> "$GITHUB_STEP_SUMMARY"
