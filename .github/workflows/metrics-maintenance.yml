name: Metrics Maintenance

run-name: Metrics maintenance for ${{ github.event.client_payload.target_sha }}

on:
  repository_dispatch:
    types: [metrics-maintenance]

permissions:
  contents: read

concurrency:
  group: metrics-maintenance
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Metrics Maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.METRICS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.METRICS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub App identity
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Publish deterministic maintenance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          bun scripts/metrics-publication.ts maintenance \
            --repository "$GITHUB_REPOSITORY" \
            --bot-login '${{ steps.app-token.outputs.app-slug }}[bot]' \
            --deadline-seconds 270 \
            --poll-seconds 5 | tee -a "$GITHUB_STEP_SUMMARY"
