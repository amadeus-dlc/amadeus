# Maintenance-only retention for the no-silent-drop event ledger (#2338).
# Writes a snapshot and deletes only the ULIDs it enumerates. Never mixed into
# feature PRs (metrics retention ownership split — intent 260730-metrics-pr-conflicts).
name: No silent drop retention

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: no-silent-drop-retention-main
  cancel-in-progress: false

jobs:
  retain:
    name: Compact event ledger
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dry-run retention
        id: dry
        run: |
          bun scripts/no-silent-drop-retention.ts | tee /tmp/nsd-retention.txt
          if grep -q '^would write snapshot' /tmp/nsd-retention.txt; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply retention on a maintenance branch
        if: steps.dry.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="nsd-retention-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          bun scripts/no-silent-drop-retention.ts --apply
          git add tests/no-silent-drop/events
          git commit -m "chore(nsd): compact event ledger via snapshot retention"
          git push -u origin HEAD
          gh pr create \
            --title "chore(nsd): compact event ledger" \
            --body "Automated no-silent-drop retention (#2338). Snapshot + enumerated deletes only; no feature changes." \
            --base main \
            --head "$branch"
          gh pr merge --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
