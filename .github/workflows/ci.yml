name: CI

# Runs the same checks the contributor workflow documents (docs/reference/11-contributing.md):
# typecheck, lint, the dist/ + self-install drift guards, and the smoke+unit+integration
# test tier. The live integration tests self-skip when the claude CLI / model-provider
# substrate is absent (as it is on the runner), so this stays green without credentials.
# Pull requests are merged through GitHub's merge queue; the queue's `merge_group`
# run is the authoritative pre-merge revalidation and `CI Success` is the required
# aggregate status. Direct PR green checks are advisory until the queue run passes.
on:
  workflow_dispatch: {}
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    # Snapshot-only merges must not create another snapshot review branch.
    paths-ignore:
      - metrics/**
  pull_request:

concurrency:
  # Main pushes must all run to completion: a cancelled main run skips the
  # coverage job, leaving no metrics snapshot for that commit (originally
  # motivated by the external coverage service's base reports, #777; the
  # completeness guarantee is still wanted for snapshots).
  # cancel-in-progress: false alone is not enough — a concurrency group holds
  # at most one pending run, so a third consecutive push would still replace
  # (cancel) the queued one. Keying the group by SHA on main gives every push
  # its own group, so nothing can be cancelled or replaced. PR branches keep
  # the ref-keyed group with supersede cancellation.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect CI changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      drift: ${{ steps.filter.outputs.drift }}
      coverage: ${{ steps.filter.outputs.coverage }}
      risk: ${{ steps.filter.outputs.risk }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect CI-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA}" ]]; then
            printf 'full=false\ndrift=false\ncoverage=false\nrisk=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          list_changed_files() {
            if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "merge_group" ]]; then
              git diff --name-only -z --no-renames "${BASE_SHA}...${HEAD_SHA}"
            elif [[ "${BASE_SHA}" =~ ^0+$ ]]; then
              git ls-tree -r --name-only -z "${HEAD_SHA}"
            else
              git diff --name-only -z --no-renames "${BASE_SHA}" "${HEAD_SHA}"
            fi
          }

          list_changed_files | bash scripts/detect-ci-changes.sh >> "${GITHUB_OUTPUT}"

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build generated distributions
        run: bun run build

      - name: Typecheck (tsc --noEmit, both tsconfigs)
        run: bun run typecheck

  lint:
    name: Lint and complexity
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      - name: Test timing sink guard
        run: bun tests/test-time-factor-guard.ts

      - name: No silent drop (trusted base ratchet)
        timeout-minutes: 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request) BASE_REVISION="${PULL_REQUEST_BASE_SHA}" ;;
            merge_group) BASE_REVISION="${MERGE_GROUP_BASE_SHA}" ;;
            push) BASE_REVISION="${PUSH_BEFORE_SHA}" ;;
            workflow_dispatch)
              if ! BASE_REVISION="$(git rev-parse --verify --quiet HEAD^)"; then
                echo "Trusted base revision is unavailable: workflow_dispatch HEAD has no parent" >&2
                exit 2
              fi
              ;;
            *)
              echo "No trusted base revision for event: ${EVENT_NAME}" >&2
              exit 2
              ;;
          esac

          if [[ "${BASE_REVISION}" =~ ^0+$ ]]; then
            echo "Trusted base revision must not be all zeros" >&2
            exit 2
          fi
          if [[ ! "${BASE_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Trusted base revision must be a 40-character lowercase hexadecimal SHA: ${BASE_REVISION}" >&2
            exit 2
          fi
          if ! git cat-file -e "${BASE_REVISION}^{commit}" 2>/dev/null; then
            echo "Trusted base revision is unavailable after full-history checkout: ${BASE_REVISION}" >&2
            exit 2
          fi
          timeout --signal=TERM --kill-after=5s 30s bun run no-silent-drop -- --base-revision "${BASE_REVISION}"

      # VER-4: the legacy audit writer and the pre-OTel observe() wrapper are
      # being retired call site by call site. The allowlist ratchets down only,
      # and the residual count is printed on every run so the walk to zero (the
      # FR-MIG-4(c) deletion-gate condition) stays visible in the job log.
      - name: Call-site guard (legacy emit path, shrink-only ratchet)
        run: bun tests/callsite-guard.ts --check

      # FR-3a (#1980): reads that give a JSON value taken off disk a domain type
      # without proving it. The allowlist ratchets down only, so a NEW unchecked
      # cast fails the job while the existing ones stay visible in the log as the
      # debt they are. Placed beside the call-site guard: both live in tests/ and
      # CI runs each as one lint step.
      - name: Unchecked-cast guard (JSON read paths, shrink-only ratchet)
        run: bun tests/unchecked-cast-guard.ts --check

      - name: Build generated distributions
        run: bun run build

      # FR-MIG-4: the six-condition deletion gate for the legacy audit writer.
      # --check does not fail the job — BLOCKED is the expected state for the
      # whole migration period, and a permanently red job gets ignored. What CI
      # carries away is the machine-readable report (BR-16); it is the only
      # admissible evidence that deletion may begin, and the deletion procedure
      # runs `--require-green`, which does exit 1 unless every condition PASSes.
      - name: Deletion gate (legacy writer, six-condition machine verification)
        run: bun tests/deletion-gate.ts --check --report deletion-gate-report.json

      - name: Upload deletion gate report (FR-MIG-4 evidence, BR-16)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amadeus-deletion-gate-report
          path: deletion-gate-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Install lizard (CCN measurement, pinned)
        run: pip install lizard==1.23.0

      - name: Complexity gate (CCN baseline ratchet)
        run: bun tests/complexity-gate.ts --check

  # #2814. A raw control byte in a tracked source is invisible to `git diff`
  # past 8KB, to grep (which calls the file binary), and to review. This job
  # runs on EVERY event with no `needs` and no `if`: a path filter would let a
  # change land through whichever paths the filter excused, which is precisely
  # the blind spot the gate closes. It reads no build output, so it needs
  # neither `bun install` nor `bun run build`.
  control-byte-gate:
    name: Control byte gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Control byte gate (tracked files, byte-level scan)
        run: timeout --signal=TERM --kill-after=5s 30s bun tests/control-byte-gate.ts --check

  coverage-registry:
    name: Coverage registry
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build generated distributions
        run: bun run build

      - name: Check committed coverage registry
        run: bun tests/gen-coverage-registry.ts --check

  distribution-contract:
    name: Intent Mirror distribution contract
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build generated distributions
        run: bun run build

      - name: Intent Mirror distribution contract
        run: bun run distribution:check

  # FR-5 (#1589). The e2e tier is NOT part of `test:ci` (run-tests --ci is
  # smoke+unit+integration), so the shipped plugin install journey would
  # otherwise never run on a PR — which is how #1569 reached a release. This job
  # runs that one journey and nothing else: offline, no env gate, no live model,
  # and it does not alter the `test:ci` profile any other job depends on.
  plugin-conformance-e2e:
    name: Plugin conformance E2E
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_TIME_FACTOR: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build generated distributions
        run: bun run build

      - name: Plugin conformance journey (e2e)
        run: bun test --timeout="$(bun tests/test-timeout-ms.ts 30000)" tests/e2e/t341-plugin-conformance-journey.serial.test.ts

  # Risk tier (#1981): core/TLA/large PRs run the complete e2e layer. Ordinary
  # full PRs retain the focused plugin-conformance journey above.
  e2e:
    name: E2E tests (risk tier)
    needs: changes
    if: ${{ needs.changes.outputs.risk == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_TIME_FACTOR: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build generated distributions
        run: bun run build

      - name: Full e2e tier
        run: bun tests/run-tests.ts --e2e -P 4

  tests:
    name: Tests
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_TIME_FACTOR: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build generated distributions
        run: bun run build

      - name: Install lizard (CCN measurement, pinned - the suite's complexity-gate tests spawn it)
        run: pip install lizard==1.23.0

      - name: Tests - smoke + unit + integration
        run: bun run test:ci -- -P 4

      - name: Upload dynamic test-size report (#684 Phase D / #699, advisory)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amadeus-test-size-report
          path: tests/logs/test-size-report.json
          if-no-files-found: warn
          retention-days: 14

  reproducible-build:
    name: Reproducible build
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Build isolated distributions
        run: |
          set -euo pipefail
          REPRO_ROOT="${RUNNER_TEMP}/amadeus-reproducible-build"

          prepare_tree() {
            local tree="$1"
            if [[ -e "${tree}" ]]; then
              echo "::error::isolated build tree already exists: ${tree}"
              exit 1
            fi
            git clone --quiet --no-hardlinks "${GITHUB_WORKSPACE}" "${tree}"
            git -C "${tree}" checkout --quiet --detach "${GITHUB_SHA}"
            (cd "${tree}" && bun install --frozen-lockfile)
            (cd "${tree}" && bun run build)
            local version
            version="$(cd "${tree}" && bun -e 'const pkg = await Bun.file("./packages/setup/package.json").json(); console.log(pkg.version)')"
            (cd "${tree}" && bun scripts/release-dist.ts --version "${version}")
          }

          mkdir -p "${REPRO_ROOT}"
          prepare_tree "${REPRO_ROOT}/tree-a"
          prepare_tree "${REPRO_ROOT}/tree-b"

      - name: Compare generated outputs and release assets
        run: |
          set -euo pipefail
          REPRO_ROOT="${RUNNER_TEMP}/amadeus-reproducible-build"
          GENERATED_OUTPUTS=(
            dist
            .claude
            .codex
            .agents
            .cursor
            .opencode
            .kimi-code
            .pi
            AGENTS.md
            CLAUDE.md
            release-assets
          )

          for output in "${GENERATED_OUTPUTS[@]}"; do
            tree_a="${REPRO_ROOT}/tree-a/${output}"
            tree_b="${REPRO_ROOT}/tree-b/${output}"
            if [[ ! -e "${tree_a}" || ! -e "${tree_b}" ]]; then
              echo "::error::isolated build output is missing: ${output}"
              exit 1
            fi
            if ! diff -qr "${tree_a}" "${tree_b}"; then
              echo "::error::isolated builds produced different bytes: ${output}"
              exit 1
            fi
          done

  drift-check:
    name: Source-only and graph invariants
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.drift == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Source-only boundary guard
        run: bun run source-only:check

      - name: Build generated distributions
        run: bun run build

      - name: Compiled graph invariant guard
        run: bun .claude/tools/amadeus-graph.ts compile --check

  coverage-head:
    name: Coverage Report (head)
    needs: changes
    if: ${{ needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_TIME_FACTOR: "2"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch merge-group base
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          BASE_REF="${BASE_REF#refs/heads/}"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build generated distributions
        run: bun run build

      - name: Install lizard (CCN measurement, pinned - the suite's complexity-gate tests spawn it)
        run: pip install lizard==1.23.0

      - name: Generate coverage reports
        run: bun run coverage:ci -- -P 4

      - name: Project coverage gate
        run: bun tests/coverage-project-gate.ts --check

      - name: Patch coverage gate
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          AMADEUS_PATCH_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          bun tests/coverage-patch-gate.ts --check | tee /tmp/patch-gate-summary.txt
          {
            echo "## Patch Coverage Gate"
            echo
            echo '```'
            cat /tmp/patch-gate-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amadeus-coverage-report
          path: |
            coverage/lcov.info
            coverage/html
            coverage/coverage-totals.json
            coverage/tests-totals.json
          if-no-files-found: warn
          retention-days: 14

  coverage-base:
    name: Coverage Report (base)
    needs: changes
    if: ${{ needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_TIME_FACTOR: "2"
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up bun
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Resolve merge-base for the relative coverage gate
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        id: merge-base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          mb="$(git merge-base "${BASE_SHA}" HEAD)"
          echo "sha=$mb" >> "$GITHUB_OUTPUT"

      - name: Restore base coverage cache
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        id: base-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/base-coverage-totals.json
          key: relative-coverage-base-${{ steps.merge-base.outputs.sha }}

      - name: Measure base coverage
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && steps.base-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.merge-base.outputs.sha }}"
          bun install --frozen-lockfile
          build_script="$(bun -e 'const pkg = await Bun.file("package.json").json(); process.stdout.write(pkg.scripts?.build ?? "")')"
          if [[ -n "${build_script}" ]]; then
            bun run build
          else
            # The merge-base of this transition predates the root build alias.
            bun run dist && bun run promote:self
          fi
          status=0
          bun run coverage:ci -- -P 4 || status=$?
          if [[ ! -s coverage/lcov.info || ! -s coverage/coverage-totals.json ]]; then
            echo "::error::base coverage artifacts incomplete (coverage:ci exit ${status}); refusing to compare"
            exit 1
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "::warning::base suite verdict failed (exit ${status}) but coverage artifacts are complete; proceeding verdict-independent per E-CV2 D4"
          fi
          cp coverage/coverage-totals.json /tmp/base-coverage-totals.json

      - name: Upload base coverage totals
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amadeus-base-coverage-totals
          path: /tmp/base-coverage-totals.json
          if-no-files-found: error
          retention-days: 1

      - name: Base coverage not required
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: echo "Base coverage is only required for pull requests and merge groups"

  coverage:
    name: Coverage Report
    needs:
      - changes
      - coverage-head
      - coverage-base
    if: ${{ always() && needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require coverage jobs
        run: |
          test "${{ needs.coverage-head.result }}" = success
          test "${{ needs.coverage-base.result }}" = success

      - name: Checkout
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up bun
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Download head coverage totals
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: amadeus-coverage-report
          path: coverage

      - name: Download base coverage totals
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: amadeus-base-coverage-totals
          path: /tmp

      - name: Project coverage gate (absolute and merge-base-relative)
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          AMADEUS_COVERAGE_PROJECT_BASELINE: /tmp/base-coverage-totals.json
        run: |
          set -euo pipefail
          bun tests/coverage-project-gate.ts --check | tee /tmp/relative-gate-summary.txt
          {
            echo "## Project Coverage Gate (absolute and merge-base-relative)"
            echo
            echo '```'
            cat /tmp/relative-gate-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # Main-only and intentionally outside ci-success: metrics publication must
  # never extend the pull-request critical path.
  metrics-snapshot:
    name: Metrics Snapshot
    needs:
      - changes
      - coverage
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.coverage == 'true' && needs.coverage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: metrics-snapshot-main
      cancel-in-progress: false
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.METRICS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.METRICS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install lizard (CCN measurement, pinned)
        run: pip install lizard==1.23.0

      - name: Download coverage totals
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: amadeus-coverage-report
          path: coverage

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub App identity
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Publish immutable snapshot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          bun scripts/metrics-publication.ts snapshot \
            --target-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --bot-login '${{ steps.app-token.outputs.app-slug }}[bot]' \
            --deadline-seconds 270 \
            --poll-seconds 5 | tee -a "$GITHUB_STEP_SUMMARY"

  review-thread-resolution:
    name: CI Review Thread Gate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
      statuses: write
    uses: j5ik2o/ci/.github/workflows/review-thread-resolution.yml@9cf0e9a8cd74c72de704763025003ed3b7608c65
    with:
      wait_for_other_checks: "false"
      base_branch: main
      required_context: Check unresolved comments
      extra_ignored_auto_report_author_patterns: "cursor\tBugbot couldn't run - usage limit reached"
      ci_ref: 9cf0e9a8cd74c72de704763025003ed3b7608c65

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - changes
      - control-byte-gate
      - coverage-registry
      - typecheck
      - lint
      - distribution-contract
      - plugin-conformance-e2e
      - e2e
      - tests
      - reproducible-build
      - drift-check
      - coverage
      - review-thread-resolution
    if: ${{ always() }}
    steps:
      - name: All checks passed
        run: |
          require_result() {
            local name="$1"
            local actual="$2"
            if [[ "${actual}" != "success" ]]; then
              echo "${name} was ${actual}; expected success"
              exit 1
            fi
          }

          require_result "changes" "${{ needs.changes.result }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            require_result "review-thread-resolution" "${{ needs['review-thread-resolution'].result }}"
          elif [[ "${{ needs['review-thread-resolution'].result }}" != "skipped" ]]; then
            echo "review-thread-resolution was ${{ needs['review-thread-resolution'].result }}; expected skipped"
            exit 1
          fi

          # Required outside the `changes` case branches below: the gate runs on
          # every event with no path filter, so a docs-only or amadeus-only pull
          # request — the very class a filter would excuse — must still be held
          # to it. "CI Success" is the only required status check, so a job left
          # out of this assertion is advisory however loudly it fails.
          require_result "control-byte-gate" "${{ needs.control-byte-gate.result }}"

          ran=false

          case "${{ needs.changes.outputs.full }}" in
            true)
              require_result "typecheck" "${{ needs.typecheck.result }}"
              require_result "lint" "${{ needs.lint.result }}"
              require_result "coverage-registry" "${{ needs['coverage-registry'].result }}"
              require_result "distribution-contract" "${{ needs.distribution-contract.result }}"
              require_result "plugin-conformance-e2e" "${{ needs.plugin-conformance-e2e.result }}"
              require_result "tests" "${{ needs.tests.result }}"
              require_result "reproducible-build" "${{ needs.reproducible-build.result }}"
              require_result "drift-check" "${{ needs.drift-check.result }}"
              ran=true
              ;;
            false)
              ;;
            *)
              echo "changes returned an invalid full decision"
              exit 1
              ;;
          esac

          case "${{ needs.changes.outputs.drift }}" in
            true)
              if [[ "${{ needs.changes.outputs.full }}" != "true" ]]; then
                require_result "drift-check" "${{ needs.drift-check.result }}"
              fi
              ran=true
              ;;
            false)
              ;;
            *)
              echo "changes returned an invalid drift decision"
              exit 1
              ;;
          esac

          case "${{ needs.changes.outputs.coverage }}" in
            true)
              require_result "coverage" "${{ needs.coverage.result }}"
              ran=true
              ;;
            false)
              ;;
            *)
              echo "changes returned an invalid coverage decision"
              exit 1
              ;;
          esac

          case "${{ needs.changes.outputs.risk }}" in
            true)
              require_result "e2e" "${{ needs.e2e.result }}"
              ran=true
              ;;
            false)
              ;;
            *)
              echo "changes returned an invalid risk decision"
              exit 1
              ;;
          esac

          if [[ "${ran}" == "true" ]]; then
            echo "All applicable CI checks passed successfully"
          else
            echo "No CI-relevant changes; validation skipped"
          fi
