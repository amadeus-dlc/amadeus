name: CI

# Runs the same checks the contributor workflow documents (docs/reference/11-contributing.md):
# typecheck, lint, the dist/ + self-install drift guards, and the smoke+unit+integration
# test tier. The live integration tests self-skip when the claude CLI / model-provider
# substrate is absent (as it is on the runner), so this stays green without credentials.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    # Snapshot-only merges must not create another snapshot review branch.
    paths-ignore:
      - metrics/**
  pull_request:

concurrency:
  # Main pushes must all run to completion: a cancelled main run skips the
  # coverage job, leaving no metrics snapshot for that commit (originally
  # motivated by the external coverage service's base reports, #777; the
  # completeness guarantee is still wanted for snapshots).
  # cancel-in-progress: false alone is not enough — a concurrency group holds
  # at most one pending run, so a third consecutive push would still replace
  # (cancel) the queued one. Keying the group by SHA on main gives every push
  # its own group, so nothing can be cancelled or replaced. PR branches keep
  # the ref-keyed group with supersede cancellation.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect CI changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      drift: ${{ steps.filter.outputs.drift }}
      coverage: ${{ steps.filter.outputs.coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect CI-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA}" ]]; then
            printf 'full=false\ndrift=false\ncoverage=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          list_changed_files() {
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              git diff --name-only -z --no-renames "${BASE_SHA}...${HEAD_SHA}"
            elif [[ "${BASE_SHA}" =~ ^0+$ ]]; then
              git ls-tree -r --name-only -z "${HEAD_SHA}"
            else
              git diff --name-only -z --no-renames "${BASE_SHA}" "${HEAD_SHA}"
            fi
          }

          list_changed_files | bash scripts/detect-ci-changes.sh >> "${GITHUB_OUTPUT}"

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit, both tsconfigs)
        run: bun run typecheck

  lint:
    name: Lint and complexity
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      - name: No silent drop (trusted base ratchet)
        timeout-minutes: 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request) BASE_REVISION="${PULL_REQUEST_BASE_SHA}" ;;
            push) BASE_REVISION="${PUSH_BEFORE_SHA}" ;;
            *)
              echo "No trusted base revision for event: ${EVENT_NAME}" >&2
              exit 2
              ;;
          esac

          if [[ ! "${BASE_REVISION}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BASE_REVISION}" =~ ^0+$ ]]; then
            echo "Trusted base revision must be a non-zero full SHA" >&2
            exit 2
          fi

          if ! git cat-file -e "${BASE_REVISION}^{commit}"; then
            git fetch --no-tags --depth=1 origin "${BASE_REVISION}"
          fi
          git cat-file -e "${BASE_REVISION}^{commit}"
          timeout --signal=TERM --kill-after=5s 30s bun run no-silent-drop -- --base-revision "${BASE_REVISION}"

      # VER-4: the legacy audit writer and the pre-OTel observe() wrapper are
      # being retired call site by call site. The allowlist ratchets down only,
      # and the residual count is printed on every run so the walk to zero (the
      # FR-MIG-4(c) deletion-gate condition) stays visible in the job log.
      - name: Call-site guard (legacy emit path, shrink-only ratchet)
        run: bun tests/callsite-guard.ts --check

      # FR-3a (#1980): reads that give a JSON value taken off disk a domain type
      # without proving it. The allowlist ratchets down only, so a NEW unchecked
      # cast fails the job while the existing 33 stay visible in the log as the
      # debt they are. Placed beside the call-site guard: both live in tests/ and
      # CI runs each as one lint step.
      - name: Unchecked-cast guard (JSON read paths, shrink-only ratchet)
        run: bun tests/unchecked-cast-guard.ts --check

      # FR-MIG-4: the six-condition deletion gate for the legacy audit writer.
      # --check does not fail the job — BLOCKED is the expected state for the
      # whole migration period, and a permanently red job gets ignored. What CI
      # carries away is the machine-readable report (BR-16); it is the only
      # admissible evidence that deletion may begin, and the deletion procedure
      # runs `--require-green`, which does exit 1 unless every condition PASSes.
      - name: Deletion gate (legacy writer, six-condition machine verification)
        run: bun tests/deletion-gate.ts --check --report deletion-gate-report.json

      - name: Upload deletion gate report (FR-MIG-4 evidence, BR-16)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amadeus-deletion-gate-report
          path: deletion-gate-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Install lizard (CCN measurement, pinned)
        run: pip install lizard==1.23.0

      - name: Complexity gate (CCN baseline ratchet)
        run: bun tests/complexity-gate.ts --check

  distribution-contract:
    name: Intent Mirror distribution contract
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Intent Mirror distribution contract
        run: bun run distribution:check

  # FR-5 (#1589). The e2e tier is NOT part of `test:ci` (run-tests --ci is
  # smoke+unit+integration), so the shipped plugin install journey would
  # otherwise never run on a PR — which is how #1569 reached a release. This job
  # runs that one journey and nothing else: offline, no env gate, no live model,
  # and it does not alter the `test:ci` profile any other job depends on.
  plugin-conformance-e2e:
    name: Plugin conformance E2E
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Plugin conformance journey (e2e)
        run: bun test tests/e2e/t341-plugin-conformance-journey.serial.test.ts

  tests:
    name: Tests
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install lizard (CCN measurement, pinned - the suite's complexity-gate tests spawn it)
        run: pip install lizard==1.23.0

      - name: Tests - smoke + unit + integration
        run: bun run test:ci -- -P 4

      - name: Upload dynamic test-size report (#684 Phase D / #699, advisory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amadeus-test-size-report
          path: tests/logs/test-size-report.json
          if-no-files-found: warn
          retention-days: 14

  drift-check:
    name: Dist and self-install drift
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.drift == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dist drift guard
        run: bun run dist:check

      - name: Self-install drift guard
        run: bun run promote:self:check

      # Committed stage-graph.json / scope-grid.json vs a compile of THIS
      # repository's stages, scopes and composed plugins (#1863). t124 / t66
      # only compile fixture trees, t184 compares slug sets and t110 is a
      # golden master — none of them sees a field-level drift in the real
      # section, which is how a partial regeneration went undetected.
      - name: Compiled graph drift guard
        run: bun .claude/tools/amadeus-graph.ts compile --check

  coverage-head:
    name: Coverage Report (head)
    needs: changes
    if: ${{ needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install lizard (CCN measurement, pinned - the suite's complexity-gate tests spawn it)
        run: pip install lizard==1.23.0

      - name: Generate coverage reports
        run: bun run coverage:ci -- -P 4

      - name: Project coverage gate
        run: bun tests/coverage-project-gate.ts --check

      - name: Patch coverage gate
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AMADEUS_PATCH_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          bun tests/coverage-patch-gate.ts --check | tee /tmp/patch-gate-summary.txt
          {
            echo "## Patch Coverage Gate"
            echo
            echo '```'
            cat /tmp/patch-gate-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amadeus-coverage-report
          path: |
            coverage/lcov.info
            coverage/html
            coverage/coverage-totals.json
            coverage/tests-totals.json
          if-no-files-found: warn
          retention-days: 14

  coverage-base:
    name: Coverage Report (base)
    needs: changes
    if: ${{ needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up bun
        if: ${{ github.event_name == 'pull_request' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Resolve merge-base for the relative coverage gate
        if: ${{ github.event_name == 'pull_request' }}
        id: merge-base
        run: |
          set -euo pipefail
          mb="$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)"
          echo "sha=$mb" >> "$GITHUB_OUTPUT"

      - name: Restore base coverage cache
        if: ${{ github.event_name == 'pull_request' }}
        id: base-cache
        uses: actions/cache@v4
        with:
          path: /tmp/base-coverage-totals.json
          key: relative-coverage-base-${{ steps.merge-base.outputs.sha }}

      - name: Measure base coverage
        if: ${{ github.event_name == 'pull_request' && steps.base-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.merge-base.outputs.sha }}"
          bun install --frozen-lockfile
          status=0
          bun run coverage:ci -- -P 4 || status=$?
          if [[ ! -s coverage/lcov.info || ! -s coverage/coverage-totals.json ]]; then
            echo "::error::base coverage artifacts incomplete (coverage:ci exit ${status}); refusing to compare"
            exit 1
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "::warning::base suite verdict failed (exit ${status}) but coverage artifacts are complete; proceeding verdict-independent per E-CV2 D4"
          fi
          cp coverage/coverage-totals.json /tmp/base-coverage-totals.json

      - name: Upload base coverage totals
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: amadeus-base-coverage-totals
          path: /tmp/base-coverage-totals.json
          if-no-files-found: error
          retention-days: 1

      - name: Base coverage not required
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Base coverage is only required for pull requests"

  coverage:
    name: Coverage Report
    needs:
      - changes
      - coverage-head
      - coverage-base
    if: ${{ always() && needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require coverage jobs
        run: |
          test "${{ needs.coverage-head.result }}" = success
          test "${{ needs.coverage-base.result }}" = success

      - name: Checkout
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4

      - name: Set up bun
        if: ${{ github.event_name == 'pull_request' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Download head coverage totals
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@v4
        with:
          name: amadeus-coverage-report
          path: coverage

      - name: Download base coverage totals
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@v4
        with:
          name: amadeus-base-coverage-totals
          path: /tmp

      - name: Relative coverage gate (head vs merge-base)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AMADEUS_COVERAGE_PROJECT_BASELINE: /tmp/base-coverage-totals.json
        run: |
          set -euo pipefail
          bun tests/coverage-project-gate.ts --check | tee /tmp/relative-gate-summary.txt
          {
            echo "## Relative Coverage Gate (head vs merge-base)"
            echo
            echo '```'
            cat /tmp/relative-gate-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # Main-only and intentionally outside ci-success: metrics publication must
  # never extend the pull-request critical path.
  metrics-snapshot:
    name: Metrics Snapshot
    needs:
      - changes
      - coverage
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.coverage == 'true' && needs.coverage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: metrics-snapshot-main
      cancel-in-progress: false
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.METRICS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.METRICS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install lizard (CCN measurement, pinned)
        run: pip install lizard==1.23.0

      - name: Download coverage totals
        uses: actions/download-artifact@v4
        with:
          name: amadeus-coverage-report
          path: coverage

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub App identity
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Publish immutable snapshot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          bun scripts/metrics-publication.ts snapshot \
            --target-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --bot-login '${{ steps.app-token.outputs.app-slug }}[bot]' \
            --deadline-seconds 270 \
            --poll-seconds 5 | tee -a "$GITHUB_STEP_SUMMARY"

  # U4 formal-model-check begin
  formal-model-check:
    name: Formal model check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: formal-checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        id: formal-setup-bun
        if: always()
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Run fixed Docker model-check acceptance (all registered models)
        id: formal-acceptance
        if: always()
        continue-on-error: true
        env:
          CHECKOUT_OUTCOME: ${{ steps.formal-checkout.outcome }}
          BUN_OUTCOME: ${{ steps.formal-setup-bun.outcome }}
          EVIDENCE_ROOT: ${{ runner.temp }}/amadeus-formal-model-check
        run: |
          set -uo pipefail
          mkdir -p "${EVIDENCE_ROOT}"
          if [[ "${CHECKOUT_OUTCOME}" != "success" || "${BUN_OUTCOME}" != "success" ]]; then
            printf '{"schema":"amadeus.ci-model-check-bootstrap-failure.v1","step":"workflow-bootstrap","errorCode":"ACTION_BOOTSTRAP","checkoutOutcome":"%s","bunOutcome":"%s"}\n' \
              "${CHECKOUT_OUTCOME}" "${BUN_OUTCOME}" > "${EVIDENCE_ROOT}/bootstrap-failure.json"
            echo "exit-code=2" >> "${GITHUB_OUTPUT}"
            exit 2
          fi
          set +e
          bun plugins/formal-model-check/tools/run-model-check-ci.ts run --root "${EVIDENCE_ROOT}"
          status=$?
          set -e
          echo "exit-code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Verify terminal evidence (all registered models)
        id: formal-verify
        if: always()
        continue-on-error: true
        env:
          ACCEPTANCE_EXIT: ${{ steps.formal-acceptance.outputs.exit-code }}
          EVIDENCE_ROOT: ${{ runner.temp }}/amadeus-formal-model-check
        run: |
          set -euo pipefail
          test "${ACCEPTANCE_EXIT:-2}" -eq 0
          bun plugins/formal-model-check/tools/run-model-check-ci.ts verify --root "${EVIDENCE_ROOT}"

      - name: Upload formal model-check evidence
        id: formal-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-model-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/amadeus-formal-model-check
          if-no-files-found: error
          retention-days: 14

      - name: Publish terminal state
        id: formal-terminal
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.formal-checkout.outcome }}
          BUN_OUTCOME: ${{ steps.formal-setup-bun.outcome }}
          ACCEPTANCE_EXIT: ${{ steps.formal-acceptance.outputs.exit-code }}
          VERIFY_OUTCOME: ${{ steps.formal-verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.formal-upload.outcome }}
        run: |
          set -euo pipefail
          if [[ "${CHECKOUT_OUTCOME}" != "success" || "${BUN_OUTCOME}" != "success" ]]; then
            echo "bootstrap failure"
            exit 2
          fi
          case "${ACCEPTANCE_EXIT:-2}" in
            2) echo "model-check harness failure"; exit 2 ;;
            0|1) ;;
            *) echo "invalid model-check exit"; exit 2 ;;
          esac
          if [[ "${VERIFY_OUTCOME}" != "success" ]]; then
            echo "artifact verification failure"
            exit 2
          fi
          if [[ "${UPLOAD_OUTCOME}" != "success" ]]; then
            echo "artifact upload failure"
            exit 2
          fi
          if [[ "${ACCEPTANCE_EXIT}" -eq 1 ]]; then
            echo "model counterexample detected"
            exit 1
          fi
          echo "all registered formal models completed with NOT_DETECTED"
  # U4 formal-model-check end

  # pbt-deep-ci pbt-deep begin
  pbt-deep:
    name: PBT deep run (manual)
    # Manual-only, and deliberately absent from ci-success's needs list: a red
    # run here never blocks a pull request. Failures stay loud instead (the job
    # goes red in the Actions tab and the run step summary carries the tail of
    # the output). Silencing a failure (continue-on-error, `|| true`) is not an
    # acceptable way to keep this job green.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 2x the expected wall clock: the deep set's local run is 8.8s (max real of
    # 3 runs), x3 for the shared x86 runner is ~26s, plus checkout/bun install
    # setup (~120s) is about 2.4 min; 2 x 2.4 = 4.9, rounded up to 5 -- which is
    # also the 5-minute floor perf.yml uses for short jobs. The x3 runner factor
    # is an ESTIMATE, not a measurement; re-derive it from the first real run's
    # duration. Re-derive this whole value whenever the target set changes: deep
    # wall clock is driven by per-property body cost, not by numRuns.
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # The deep target set: the PBT this Intent (#1980) added. t274 is an
      # existing file that this Intent gave a deep property to (FR-7a), so it
      # belongs here even though the file itself is not new.
      PBT_DEEP_PATHS: |
        tests/unit/t416-election-model-roundtrip.pbt.test.ts
        tests/integration/t417-election-store-failclosed.pbt.test.ts
        tests/unit/t418-state-receipts-codec.pbt.test.ts
        tests/unit/t419-state-field-codec.pbt.test.ts
        tests/unit/t274-amadeus-mirror-state-codec.test.ts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the deep target set exists
        id: pbt_deep_paths
        # bun test drops a non-existent path silently and still exits 0, so an
        # unverified path list can report a deep run that never happened.
        run: |
          set -o pipefail
          missing=0
          count=0
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            count=$((count + 1))
            if [ ! -f "${path}" ]; then
              echo "missing deep target: ${path}"
              missing=$((missing + 1))
            fi
          done <<< "${PBT_DEEP_PATHS}"
          if [ "${count}" -eq 0 ]; then
            echo "the deep target list is empty; refusing to report an empty deep run"
            exit 1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "${missing} deep target(s) missing; refusing to report a partial deep run"
            exit 1
          fi
          echo "expected-files=${count}" >> "${GITHUB_OUTPUT}"
          echo "verified ${count} deep target(s)"

      - name: Run the deep PBT tier
        id: pbt_deep_run
        env:
          AMADEUS_PBT_DEEP: "1"
        run: |
          set -o pipefail
          # --timeout matches tests/run-tests.ts's DEFAULT_TEST_TIMEOUT_MS
          # (30_000) verbatim. Declared deviation from the unit's execution
          # contract, adopted by ruling: invoking `bun test` directly (rather
          # than through tests/run-tests.ts) inherits Bun's 5000ms per-test
          # default, which no other execution path in this repo uses. It is an
          # environment-difference absorber, not a contract change -- the deep
          # budget (numRuns) and the target set are both unchanged. Measured:
          # t417's P-EL2 takes 5.4-5.6s under the deep budget, so the 5000ms
          # default fails it while the 30s cap clears it with ~5x headroom.
          paths=()
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            paths+=("${path}")
          done <<< "${PBT_DEEP_PATHS}"
          bun test --timeout=30000 "${paths[@]}" 2>&1 | tee pbt-deep-run.log

      - name: Verify every target file actually ran
        # The pre-flight check above catches paths that are missing; this
        # catches a path that was dropped after the run started.
        env:
          EXPECTED_FILES: ${{ steps.pbt_deep_paths.outputs.expected-files }}
        run: |
          set -o pipefail
          # Bun prints "Ran N tests across M files." (and "1 file." in the
          # singular), so take the number and never depend on the suffix.
          actual=$(grep -oE 'Ran [0-9]+ tests across [0-9]+ files?\.' pbt-deep-run.log \
            | tail -n 1 | grep -oE 'across [0-9]+' | grep -oE '[0-9]+')
          if [ -z "${actual}" ]; then
            echo "could not read the file count out of pbt-deep-run.log"
            exit 1
          fi
          if [ "${actual}" != "${EXPECTED_FILES}" ]; then
            echo "deep run covered ${actual} file(s); expected ${EXPECTED_FILES}"
            exit 1
          fi
          echo "deep run covered all ${actual} target file(s)"

      - name: Summarise failure
        # Scope the summary to the test step itself: a bare failure() also
        # fires on checkout/setup/install failures and would mislabel them.
        if: ${{ failure() && steps.pbt_deep_run.conclusion == 'failure' }}
        run: |
          {
            echo "### PBT deep run failed"
            echo
            echo 'Last 50 lines of the deep run (fast-check prints the seed, replay path, and shrunk counterexample):'
            echo
            echo '```'
            tail -n 50 pbt-deep-run.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # pbt-deep-ci pbt-deep end

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - changes
      - typecheck
      - lint
      - distribution-contract
      - plugin-conformance-e2e
      - tests
      - drift-check
      - coverage
    if: ${{ always() }}
    steps:
      - name: All checks passed
        run: |
          require_result() {
            local name="$1"
            local actual="$2"
            if [[ "${actual}" != "success" ]]; then
              echo "${name} was ${actual}; expected success"
              exit 1
            fi
          }

          require_result "changes" "${{ needs.changes.result }}"

          ran=false

          case "${{ needs.changes.outputs.full }}" in
            true)
              require_result "typecheck" "${{ needs.typecheck.result }}"
              require_result "lint" "${{ needs.lint.result }}"
              require_result "distribution-contract" "${{ needs.distribution-contract.result }}"
              require_result "plugin-conformance-e2e" "${{ needs.plugin-conformance-e2e.result }}"
              require_result "tests" "${{ needs.tests.result }}"
              require_result "drift-check" "${{ needs.drift-check.result }}"
              ran=true
              ;;
            false)
              ;;
            *)
              echo "changes returned an invalid full decision"
              exit 1
              ;;
          esac

          case "${{ needs.changes.outputs.drift }}" in
            true)
              if [[ "${{ needs.changes.outputs.full }}" != "true" ]]; then
                require_result "drift-check" "${{ needs.drift-check.result }}"
              fi
              ran=true
              ;;
            false)
              ;;
            *)
              echo "changes returned an invalid drift decision"
              exit 1
              ;;
          esac

          case "${{ needs.changes.outputs.coverage }}" in
            true)
              require_result "coverage" "${{ needs.coverage.result }}"
              ran=true
              ;;
            false)
              ;;
            *)
              echo "changes returned an invalid coverage decision"
              exit 1
              ;;
          esac

          if [[ "${ran}" == "true" ]]; then
            echo "All applicable CI checks passed successfully"
          else
            echo "No CI-relevant changes; validation skipped"
          fi
