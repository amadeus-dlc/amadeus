name: Review Thread Resolution

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to refresh. Leave empty to refresh all open main PRs.
        required: false
        type: string
      wait_for_other_checks:
        description: Wait for other PR checks before evaluating review threads.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# One refresh per pull request at a time. Review events arrive in bursts (a
# single bot review fires one event per comment — 14 concurrent runs measured
# on #2939), and each run holds a hosted-runner slot while it waits for the
# PR's other checks (`wait_for_other_checks` defaults to true). Without this
# group the waiters starve the very CI they wait on (#2947). Scheduled and
# dispatched runs fall back to the event name so they only collapse among
# themselves, never cancelling a PR-scoped refresh.
concurrency:
  group: review-thread-resolution-${{ github.event.pull_request.number || github.event.issue.number || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read
  statuses: write

jobs:
  refresh:
    name: Refresh review-thread state
    uses: j5ik2o/ci/.github/workflows/review-thread-resolution.yml@9cf0e9a8cd74c72de704763025003ed3b7608c65
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr_number }}
      wait_for_other_checks: ${{ inputs.wait_for_other_checks || 'true' }}
      base_branch: main
      required_context: Check unresolved comments
      extra_ignored_auto_report_author_patterns: "cursor\tBugbot couldn't run - usage limit reached"
      ci_ref: 9cf0e9a8cd74c72de704763025003ed3b7608c65
