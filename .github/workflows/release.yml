name: Release @amadeus-dlc/setup

# One-button release. The repo uses a single `vX.Y.Z` tag axis driven by
# packages/setup's version (starting at v0.1.0): the tag is both the npm
# release of @amadeus-dlc/setup and the GitHub tag the installer resolves
# framework distributions from. Release notes are generated into the
# GitHub Release — there is no CHANGELOG file.
#
# Main entry point is workflow_dispatch: pick a bump level and release-it
# bumps the version, commits, tags `vX.Y.Z`, and pushes directly to main
# (an explicit, team-recorded exception to the PR rule — the bump commit
# is a one-line version change). The same run then creates the GitHub
# Release with auto-generated notes (softprops/action-gh-release), builds
# dist/cli.js fresh, and publishes to npm with provenance. Separate jobs let
# a failed phase be retried without repeating successful release state changes.
# GitHub App pushes trigger workflows, so this workflow ignores its own
# bot-authored tag push while CI intentionally validates the bot-authored main
# commit. Post-publish verification is a manual step
# (see docs/guide/publishing-setup.md ch. 6) — an in-run bunx smoke was
# removed after producing only false alarms (registry propagation lag
# poisons the runner's registry cache, so retries can never recover).
#
# Bootstrap: when the repo has no v* tag yet, a dispatch skips the bump
# and releases the committed version as-is (release-it --no-increment,
# tag only) — the first run creates the tag matching the current version
# with no manual tagging. A `v*` tag push remains as a fallback entry
# point: it skips the bump and runs notes -> build -> publish -> smoke.
# workflow_dispatch with dry-run rehearses (release-it --dry-run +
# npm publish --dry-run) without pushing or publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level for packages/setup'
        type: choice
        options: [patch, minor, major]
        default: patch
      dry-run:
        description: 'Rehearse: no commit/tag/push, npm publish --dry-run'
        type: boolean
        default: false

concurrency:
  group: release-setup
  cancel-in-progress: false

permissions:
  contents: read # release writes use the narrowly scoped GitHub App token below

jobs:
  prepare:
    name: Prepare release
    if: ${{ !(github.event_name == 'push' && github.actor == 'amadeus-dlc-bot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.METRICS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.METRICS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout (full history + tags for guards and the bootstrap check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Guard — dispatch must run on main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::run this workflow on main (got ${GITHUB_REF})"
          exit 1

      - name: Guard — tag matches version and commit is on main
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(bun -e 'const pkg = await Bun.file("./packages/setup/package.json").json(); console.log(pkg.version)')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v${tag_version} does not match packages/setup version ${pkg_version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi

      - name: Bump, commit, tag, push (release-it)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/setup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_user_id="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email "${bot_user_id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          if [ -z "$(git tag --list 'v*')" ]; then
            # Bootstrap: no v* tag exists yet — release the committed version
            # as-is (tag only, no bump commit).
            echo "no v* tags found — bootstrapping the first release without a bump"
            args=(--no-increment --no-git.commit --ci)
          else
            args=(${{ inputs.bump }} --ci)
          fi
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          bunx --bun release-it "${args[@]}"

      - name: Resolve release
        id: release
        run: |
          echo "version=$(bun -e 'const pkg = await Bun.file("./packages/setup/package.json").json(); console.log(pkg.version)')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-dist:
    name: Build release distribution assets
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip dist asset build (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: echo "dry run — skipping dist asset build and upload"

      - name: Checkout released commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up bun
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: bun install --frozen-lockfile

      - name: Build dist
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: bun scripts/package.ts

      - name: Run full test suite
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: bun run test:ci

      - name: Verify source-only boundary
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: bun run source-only:check

      - name: Verify graph compile invariants
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: bun dist/claude/.claude/tools/amadeus-graph.ts compile --check

      - name: Build release assets
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: bun scripts/release-dist.ts --version "${{ needs.prepare.outputs.version }}"

      - name: Upload release assets
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: release-assets/
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [prepare, build-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip GitHub Release (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: echo "dry run — skipping GitHub Release creation"

      - name: Create GitHub App token
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.METRICS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.METRICS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Download release assets
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: release-assets

      - name: Create GitHub Release with generated notes
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          token: ${{ steps.app-token.outputs.token }}
          files: |
            release-assets/amadeus-dist-v${{ needs.prepare.outputs.version }}.tar.gz
            release-assets/amadeus-dist-v${{ needs.prepare.outputs.version }}.manifest.json
            release-assets/SHA256SUMS

  publish:
    name: Build and publish npm package
    needs: [prepare, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Checkout released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Set up node (npm publish + provenance)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dist/cli.js (fresh)
        working-directory: packages/setup
        run: bun run build

      - name: Publish to npm
        working-directory: packages/setup
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          args=(--access public)
          case "$version" in
            *-*) args+=(--tag next) ;; # prerelease never touches `latest`
          esac
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}" = "true" ]; then
            npm publish --dry-run "${args[@]}"
          else
            npm publish --provenance "${args[@]}"
          fi
