name: バグ報告
description: 実測できる不具合を、再現・原因分析・P/S分類に必要な証拠とともに報告します
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        推測ではなく、実際に観測した事実を記載してください。秘密情報や認証情報は含めないでください。

        このフォームは `bug` ラベルを自動付与します。ラベルを付与できる起票者は、選択した P/S と同名のラベルも起票時に付与してください。権限がない場合、選択内容を maintainer がトリアージ時にラベルへ反映します。

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 重複・既修正の確認
      description: 推測起票と重複起票を避けるため、起票前に両方を確認してください。
      options:
        - label: open/closed の両方を対象に、同じ症状・機序の Issue を検索しました
          required: true
        - label: origin/main と関連する修正 PR を確認し、既修正の自ブランチ未取込ではないことを確認しました
          required: true

  - type: textarea
    id: symptom
    attributes:
      label: 症状
      description: 何をしたとき、何が起きたかを簡潔に記載してください。
      placeholder: 例：`bun ...` を実行すると、状態更新前に exit 0 で終了する。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 観測環境・対象リビジョン
      description: 対象 SHA、ブランチ、OS、Bun/Amadeus バージョンなど、再現に必要な環境を記載してください。
      placeholder: |
        - revision:
        - branch:
        - OS:
        - Bun / Amadeus:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 最小の再現手順を順番に記載してください。再現できない場合は、観測条件と取得済み証拠を記載してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 実測証拠
      description: 実行したコマンドと結果、exit code、確認した file:line、ログのうち該当するものを記載してください。
      placeholder: |
        command:
        exit code:
        output:
        file:line:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
      description: 既存契約・要件・利用者の期待に照らして、どう動作すべきかを記載してください。
    validations:
      required: true

  - type: textarea
    id: mechanism
    attributes:
      label: 機序
      description: 症状が生じるコード経路を記載してください。未特定なら「未特定」と書き、仮説は仮説と明記してください。
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響
      description: 影響する利用者・ワークフロー・データと、回避策の有無を記載してください。
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度（いつ直すか）
      description: 選択した P ラベルを起票時に付与してください。
      options:
        - P0 — 正しさ・安全性の破綻
        - P1 — 重要だが回避可能
        - P2 — 通常
        - P3 — いつか対応
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 重大度（どれだけ深刻か）
      description: 選択した S ラベルを起票時に付与してください。優先度とは独立に判断します。
      options:
        - S1-FATAL — データ・監査・ゲート整合性の破壊、誤マージ誘発、ワークフロー停止
        - S2-CRITICAL — 主要機能の誤動作、または回避策のない偽 green・偽赤
        - S3-MAJOR — 回避策のある誤動作、または限定条件での発現
        - S4-MINOR — 軽微、エッジケース、表示層
    validations:
      required: true

  - type: dropdown
    id: cause-location
    attributes:
      label: 原因の所在
      description: 現時点の実測に基づく分類を選択してください。未確定なら「未特定」を選びます。
      options:
        - 要件での見落とし
        - 設計判断の誤り
        - 設計は正しいが実装が逸脱
        - origin:bootstrap
        - 外部要因
        - 未特定
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: 原因の根拠・導入経緯
      description: 原因分類の根拠を記載してください。intent に遡れる場合は record または導入コミットも示してください。該当しない場合は理由を記載します。
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 補足
      description: 関連 Issue、PR、スクリーンショットなどがあれば記載してください。
