# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ja
early_access: false
enable_free_tier: true

tone_instructions: |
  簡潔かつ具体的にレビューすること。
  このプロジェクトは "Less is more" と "YAGNI" を設計原則としている。
  過剰設計や不要な抽象化を指摘すること。
  Bun 専用の TypeScript モノレポとして、型安全性とハーネス間の一貫性を重視すること。

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  abort_on_close: true

  path_filters:
    - "!dist/**"
    - "!.agents/**"
    - "!.claude/**"
    - "!.codex/**"
    - "!.cursor/**"
    - "!.opencode/**"
    - "!.kimi-code/**"
    - "!.pi/**"
    # Workflow records are append-only process/audit artifacts, not editable
    # sources: intents (stage records + audit shards), elections (ballot
    # ledgers), codekb (RE-generated observation snapshots pinned to observed
    # commits, refreshed only by RE diff-refresh). Review suggestions against
    # them are category errors (Issue #1951 class ruling). memory/ and
    # knowledge/ stay reviewable: they are hand-authored policy.
    - "!amadeus/spaces/*/intents/**"
    - "!amadeus/spaces/*/elections/**"
    - "!amadeus/spaces/*/codekb/**"
    # Metrics snapshots are append-only generated captures; defects are fixed
    # in the collector and recovered by revert PR, never by editing snapshots.
    - "!metrics/**"

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - main

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  labeling_instructions: []

  tools:
    biome:
      enabled: true
    gitleaks:
      enabled: true
    ast-grep:
      essential_rules: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/rules/*.md"
      - ".agents/skills/*/SKILL.md"
      - "amadeus/spaces/default/memory/**/*.md"
      - "docs/guide/glossary.md"
      - "docs/guide/glossary.ja.md"
      - "amadeus/spaces/default/knowledge/amadeus-shared/software-design/README.md"
      - "amadeus/spaces/default/knowledge/amadeus-shared/software-design/*/SKILL.md"

chat:
  auto_reply: true
