# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ja
early_access: false
enable_free_tier: true

tone_instructions: |
  簡潔かつ具体的にレビューすること。
  このプロジェクトは "Less is more" と "YAGNI" を設計原則としている。
  過剰設計や不要な抽象化を指摘すること。
  Bun 専用の TypeScript モノレポとして、型安全性とハーネス間の一貫性を重視すること。

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  abort_on_close: true

  path_filters:
    - "!dist/**"
    - "!.agents/**"
    - "!.claude/**"
    - "!.codex/**"
    - "!.cursor/**"
    - "!.opencode/**"
    - "!.kimi-code/**"

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - main

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  labeling_instructions: []

  tools:
    biome:
      enabled: true
    gitleaks:
      enabled: true
    ast-grep:
      essential_rules: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/rules/*.md"
      - ".agents/skills/*/SKILL.md"
      - "amadeus/spaces/default/memory/**/*.md"
      - "amadeus/spaces/default/knowledge/amadeus-shared/domain-language.md"
      - "amadeus/spaces/default/knowledge/amadeus-shared/software-design/README.md"
      - "amadeus/spaces/default/knowledge/amadeus-shared/software-design/*/SKILL.md"

chat:
  auto_reply: true
